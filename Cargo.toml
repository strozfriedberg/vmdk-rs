[package]
name = "vmdk-rs"
version = "0.1.0"
authors = ["LevelBlue"]
edition = "2021"

[profile.release]
debug = false
lto = true

[lib]
name = "vmdkrs"
path = "src/lib.rs"

[[bin]]
name = "reader"
path = "src/main.rs"

[features]
capi = []

[dependencies]
async-trait = "0.1.89"
byteorder = "1.5"
clap = { version = "4.1.7", features = ["derive"] }
flate2 = "1"
futures = "0.3.31"
#kaitai = { git = "https://github.com/Agile86/kaitai_rust.git", branch = "rust_basic_support_v2" }
kaitai = { git = "https://github.com/uckelman-sf/kaitai_struct_rust_runtime.git", branch = "master" }
once_cell = "1.21.3"
regex = "1"
#rust-s3 = "0.37.0"
rust-s3 = { git = "https://github.com/uckelman-sf/rust-s3.git", branch = "master" }
sha-1 = "^0.10"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["fs", "io-util", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
url = "2.5.7"

[dev-dependencies]
rand = "0.9"
